# F2 benchmark manifest: named sets of (kata, Plan) pairs for `harness-workflow bench <set>`.
# Plans live here, so a run can be repeated from them; kata repos are referenced by path (make them with
# examples/graphs/make_katas.py). A pair may set `project` to override practice_dir/<kata>, and `hidden` to a Hidden
# test suite (F7) that grades the run's final code after it ends.

practice_dir = "~/projects/braid-practice"

[sets.claude-plans]
description = "The five katas with the Plans Claude wrote (M13; F1's Haiku row: 29/30)."
pairs = [
  { kata = "bowling", plan = "plans/claude/bowling.json" },
  { kata = "cron-next", plan = "plans/claude/cron-next.json" },
  { kata = "roman-numerals", plan = "plans/claude/roman-numerals.json" },
  { kata = "semver-compare", plan = "plans/claude/semver-compare.json" },
  { kata = "word-wrap", plan = "plans/claude/word-wrap.json" },
]

[sets.local-plans]
description = "The five katas with the Plans gemma4:e4b wrote in the Plan loop (M14; F1's Haiku row: 21/24)."
pairs = [
  { kata = "bowling", plan = "plans/local/bowling.json" },
  { kata = "cron-next", plan = "plans/local/cron-next.json" },
  { kata = "roman-numerals", plan = "plans/local/roman-numerals.json" },
  { kata = "semver-compare", plan = "plans/local/semver-compare.json" },
  { kata = "word-wrap", plan = "plans/local/word-wrap.json" },
]

[sets.disputed]
description = """F3: the Plans behind the four Behaviors Haiku disputed in the F1 live check (word-wrap B5 on Claude's
Plan; bowling B2 and B3 and word-wrap B2 on the local Plans), with Invariants added by hand."""
pairs = [
  { kata = "word-wrap", name = "word-wrap/claude", plan = "plans/disputed/word-wrap-claude.json" },
  { kata = "bowling", name = "bowling/local", plan = "plans/disputed/bowling-local.json" },
  { kata = "word-wrap", name = "word-wrap/local", plan = "plans/disputed/word-wrap-local.json" },
]

[sets.disputed-control]
description = "The control for `disputed`: the same three Plans without Invariants, so no Dispute can be upheld."
pairs = [
  { kata = "word-wrap", name = "word-wrap/claude", plan = "plans/claude/word-wrap.json" },
  { kata = "bowling", name = "bowling/local", plan = "plans/local/bowling.json" },
  { kata = "word-wrap", name = "word-wrap/local", plan = "plans/local/word-wrap.json" },
]

[sets.exotic]
description = """F7: six invented katas (2 easy, 2 medium, 2 hard) with their Plans, graded after each run by Hidden tests
the model never sees, and by how many mutants its own tests kill."""
pairs = [
  { kata = "ferry-fare", plan = "exotic/ferry-fare/plan.json", hidden = "exotic/ferry-fare/hidden" },
  { kata = "velm-calendar", plan = "exotic/velm-calendar/plan.json", hidden = "exotic/velm-calendar/hidden" },
  { kata = "rune-seal", plan = "exotic/rune-seal/plan.json", hidden = "exotic/rune-seal/hidden" },
  { kata = "orchard-score", plan = "exotic/orchard-score/plan.json", hidden = "exotic/orchard-score/hidden" },
  { kata = "ration-queue", plan = "exotic/ration-queue/plan.json", hidden = "exotic/ration-queue/hidden" },
  { kata = "stitch-markup", plan = "exotic/stitch-markup/plan.json", hidden = "exotic/stitch-markup/hidden" },
]
