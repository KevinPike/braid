[ollama]
host = "http://localhost:11434"

[profile]
model = "gemma4:e4b"
num_ctx = 32768
keep_alive = "30m"
system_prompt = "You are a concise, helpful assistant running locally."

[paths]
data_dir = "~/.braid"

[context]
strategy = "summarize"        # none | sliding_window | summarize
summarizer_model = "gemma4:e2b"   # falls back to the daily driver when not pulled
summarizer_num_ctx = 16384
ceiling = 0.9
target = 0.5
preserve_recent = 6
offload_tokens = 4000

[tools]
enabled = true
root = "."
notes_dir = "notes"
shell = true                  # every command needs TUI approval (ADR 0003) and runs in the Sandbox (ADR 0005)
shell_network = false         # allow network access to sandboxed shell commands
write = true                  # write_file; every write needs TUI approval
approve = ["shell", "write_file"]   # tools gated by approval; these two are always gated

[decide]
enabled = true
model = "tev1:0.8b"
max_input_tokens = 1500

[telemetry]
enabled = false               # OTLP/HTTP traces and metrics; see harness/telemetry.py for a local collector
endpoint = "http://localhost:4318"
service_name = "braid"

[evals]
models = ["gemma4:e4b", "gemma4:e2b", "gemma4:12b", "gpt-oss:20b"]   # not-pulled models are skipped
num_ctx = 8192

[workflow]
# model = "gemma4:12b"        # default: the [profile] model
num_ctx = 16384
max_attempts = 3
max_polish_rounds = 1         # 0 skips Polish
test_command = ".venv/bin/python -m pytest -q --no-header -p no:cacheprovider"
lint_commands = []            # each must exit 0 after Polish, or Polish is reverted
workspaces_dir = "~/.braid/workspaces"
runs_dir = "~/.braid/runs"    # one JSONL log per run
