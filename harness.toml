[ollama]
host = "http://localhost:11434"

[profile]
model = "gemma4:e4b"
num_ctx = 32768
keep_alive = "30m"
system_prompt = "You are a concise, helpful assistant running locally."

[paths]
data_dir = "~/.braid"

[context]
strategy = "summarize"        # none | sliding_window | summarize
summarizer_model = "gemma4:e2b"   # falls back to the daily driver when not pulled
summarizer_num_ctx = 16384
ceiling = 0.9
target = 0.5
preserve_recent = 6
offload_tokens = 4000

[tools]
enabled = true
root = "."
notes_dir = "notes"
shell = true                  # every command needs TUI approval (ADR 0003) and runs in the Sandbox (ADR 0005)
shell_network = false         # allow network access to sandboxed shell commands
write = true                  # write_file; every write needs TUI approval
approve = ["shell", "write_file"]   # tools gated by approval; these two are always gated

[decide]
enabled = true
model = "tev1:0.8b"
max_input_tokens = 1500

[telemetry]
enabled = false               # OTLP/HTTP traces and metrics; see harness/telemetry.py for a local collector
endpoint = "http://localhost:4318"
service_name = "braid"

[evals]
models = ["gemma4:e4b", "gemma4:e2b", "gemma4:12b", "gpt-oss:20b"]   # not-pulled models are skipped
num_ctx = 8192

[workflow]
backend = "ollama"            # "anthropic" runs Workflows on the Anthropic API (ADR 0006): data leaves the machine and runs cost money
# model = "gemma4:e4b"        # Ollama model; default: the [profile] model (gemma4:12b is too heavy for this 24 GB Mac)
# anthropic_model = "claude-haiku-5-5"  # a --model / /build --model id starting with "claude-" picks this backend too
# effort = "low"              # Anthropic only: low | medium | high | xhigh | max; default leaves the model's own
max_cost_usd = 0.10           # Spend cap: an API run stops at the next node boundary once it has cost more; nothing is applied
# No API key here, ever: the SDK reads ANTHROPIC_API_KEY, else an `ant auth login` profile.
num_ctx = 16384
think = false                 # thinking text is dropped, so do not pay for it
num_predict = 4096            # max generated tokens per model call
max_attempts = 3
max_polish_rounds = 1         # 0 skips Polish
test_command = ".venv/bin/python -m pytest -q --no-header -p no:cacheprovider"
lint_commands = []            # each must exit 0 after Polish, or Polish is reverted
workspaces_dir = "~/.braid/workspaces"
runs_dir = "~/.braid/runs"    # one JSONL log per run
plans_dir = "~/.braid/plans"  # Plan loop output, one <id>.json per Plan
checkpoints_db = "~/.braid/workflows.db"  # TUI runs: checkpoints for /build --resume, and the /runs index
max_rounds = 3                # Plan loop: draft/review rounds
critique_angles = ["feasibility", "scope", "testability", "risk", "spacing"]
# [workflow.critique_prompts]  # a system prompt per angle: a new angle, or a replacement for a built-in one
# usability = "You review a draft Plan as the person who will use the tool ..."
