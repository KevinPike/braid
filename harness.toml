[ollama]
host = "http://localhost:11434"

[profile]
model = "gemma4:e4b"
num_ctx = 32768
keep_alive = "30m"
system_prompt = "You are a concise, helpful assistant running locally."

[paths]
data_dir = "~/.harness"

[context]
strategy = "summarize"        # none | sliding_window | summarize
summarizer_model = "gemma4:e2b"   # falls back to the daily driver when not pulled
summarizer_num_ctx = 16384
ceiling = 0.9
target = 0.5
preserve_recent = 6
offload_tokens = 4000

[tools]
enabled = true
root = "."
notes_dir = "notes"
shell = false                 # stays off until M8 adds the approval prompt

[decide]
enabled = true
model = "tev1:0.8b"
max_input_tokens = 1500
