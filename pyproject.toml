[project]
name = "braid"
version = "0.1.0"
description = "An agent harness for exploring Workflows as graphs: a Textual TUI over a Strands agent and LangGraph Workflows, on the Anthropic API (or, frozen, on Ollama with a runtime guard)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "pydantic>=2.14.0",
    "strands-agents[ollama]>=1.59.0",
    "textual>=8.2.8",
]

[project.scripts]
harness = "harness:main"
harness-eval = "harness.evals:main"
harness-workflow = "harness.workflow.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "harness"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]
evals = [
    "strands-agents-evals>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]  # bench/exotic holds hidden kata tests that run only against kata modules (verify.py)

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["strands_evals", "strands_evals.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "harness.evals.scoring"
disallow_subclassing_any = false
disallow_any_unimported = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]  # no "I": its wrapping breaks the compact import lists
ignore = ["E501"]  # long lines are a formatting question; ruff format is not adopted

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["harness.context.compaction.CompactionPolicy"]
