repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0  # the version in uv.lock; check only, ruff format is not adopted
    hooks:
      - id: ruff-check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]  # uv.lock is ~700 KB
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23  # the installed uv
    hooks:
      - id: uv-lock
# mypy (`uv run mypy src tests`) and pytest (~2.5 min) stay manual; the AGENTS.md gates cover them before a commit.
