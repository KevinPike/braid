[ollama]
host = "http://localhost:11434"

[profile]
backend = "anthropic"         # ADR 0007: the chat agent on the Anthropic API; "ollama" is the frozen local path
anthropic_model = "claude-haiku-5-5"
# effort = "low"              # Anthropic only: low | medium | high | xhigh | max; default leaves the model's own
# context_window = 200000     # Anthropic only: compaction's window (default: the model's real one, 1M for Haiku 5.5)
# No API key here, ever: the SDK reads ANTHROPIC_API_KEY, else an `ant auth login` profile.
model = "gemma4:e4b"          # Ollama only (a "claude-" id here picks the API instead)
num_ctx = 32768               # Ollama only
keep_alive = "30m"            # Ollama only
system_prompt = "You are a concise, helpful assistant."

[anthropic]
max_retries = 2               # the SDK retries 408/409/429/5xx (529 included) and dropped connections, honoring retry-after;
                              # past that a Workflow run stops with status api_error (resumable), a chat turn with a note
timeout = 600.0               # seconds per request
thinking_display = "summarized"   # F9: "summarized" returns a readable thinking summary (run log, Inspectors);
                              # "omitted" is the 5.5 models' default (empty thinking). Billed the same either way
# thinking_sample = 1.0       # share of Workflow calls that think (0-1); the rest send thinking disabled: faster and cheaper,
                              # logged per node as thinking_on. A sampled run mixes two treatments; compare like with like

# ADR 0009: OpenRouter, any model with structured output, through the same Anthropic SDK. Key: OPENROUTER_API_KEY, never here.
# Use it with `--backend openrouter --model z-ai/glm-5.3` (any `vendor/model` id picks it); `harness-workflow models` lists them.
[openrouter]
# data_collection = "deny"    # "deny" excludes most :free models (they train on prompts); "allow" lets them run
# max_tokens = 4096          # per call; a runaway reply is cut here and retried once, instead of running to 16000
# require_parameters = true   # never route to a provider that ignores response_format
# max_price = { prompt = 1.0, completion = 3.0 }   # USD per million tokens; a request over it is a 404, not a spend
# fallbacks = []              # other model ids tried in order when the model errors
# [openrouter.auto]           # --model openrouter/auto: OpenRouter picks per call, ranked by 7-day spend share
# cost_tier = "medium"        # low | medium | high | xhigh | max: a band, not a ceiling
# allowed_models = ["anthropic/*"]   # required; every model it admits needs structured output
# excluded_models = []

[paths]
data_dir = "~/.braid"

[context]
strategy = "summarize"        # none | sliding_window | summarize
summarizer_model = "gemma4:e2b"   # Ollama only (falls back to the daily driver when not pulled); the API summarizes with the chat model
summarizer_num_ctx = 16384
ceiling = 0.9
target = 0.5
preserve_recent = 6
offload_tokens = 4000

[tools]
enabled = true
root = "."
notes_dir = "notes"
shell = true                  # every command needs TUI approval (ADR 0003) and runs in the Sandbox (ADR 0005)
shell_network = false         # allow network access to sandboxed shell commands
write = true                  # write_file; every write needs TUI approval
approve = ["shell", "write_file"]   # tools gated by approval; these two are always gated
ask = true                    # ask_user_question: the chat agent may put a Choice to you; it acts on nothing (ADR 0010)

[ask]
calls_per_turn = 3            # Choices the chat agent may open per prompt; later calls are refused
refusals_per_turn = 2         # refused calls (bad shape, a confirmation) before the tool stops for the turn
timeout_s = 0                 # 0 waits as an Approval does; otherwise the Choice times out and nothing is chosen

[decide]
# ADR 0003, 0014: a Decider answers typed questions with probabilities. Advisory in the chat; error triage in a run picks a note.
enabled = true
backend = "auto"              # "auto": tev1 on the ollama backend, off elsewhere. "openrouter": Jev, an API call (needs OPENROUTER_API_KEY)
model = "tev1:0.8b"          # the Ollama Decider (frozen path)
max_input_tokens = 1500
openrouter_model = "~typesafe/jev-latest"
ask = ["policy", "compaction"]   # what the chat asks an API Decider
timeout_s = 4.0               # per API call; advice is awaited before an Approval prompt shows
max_cost_usd = 0.05           # per chat session; past it the API Decider stops

[telemetry]
enabled = false               # OTLP/HTTP traces and metrics; see harness/telemetry.py for a local collector
endpoint = "http://localhost:4318"
service_name = "braid"

[evals]
models = ["gemma4:e4b", "gemma4:e2b", "gemma4:12b", "gpt-oss:20b"]   # not-pulled models are skipped
num_ctx = 8192

[workflow]
backend = "anthropic"         # ADR 0006/0007: Workflows on the Anthropic API (data leaves the machine, runs cost money); "ollama" is frozen
# model = "gemma4:e4b"        # Ollama model; default: the [profile] model (gemma4:12b is too heavy for this 24 GB Mac)
# anthropic_model = "claude-haiku-5-5"  # a --model / /build --model id starting with "claude-" picks this backend too
# effort = "low"              # Anthropic only: low | medium | high | xhigh | max; default leaves the model's own
slow_call_s = 60.0           # warn once on stderr when one API request takes this long (0: never)
max_cost_usd = 0.10           # Spend cap: an API run stops at the next node boundary once it has cost more; nothing is applied
# triage = true              # ADR 0014: Jev sorts a failed Green run into an error kind and the implementer gets a canned note (needs
                              # OPENROUTER_API_KEY; the CLI and bench only for now). Code still routes. triage_min_p = 0.6 sets the cutoff.
# arbiter = "claude-sonnet-5-5"   # F10: a stronger model rules on a Dispute no Invariant upholds (or claude-opus-5-5);
                              # unset, there is no arbitrate node. Its calls count toward the Spend cap
# arbiter_effort = "medium"   # the Arbiter's effort; default leaves the model's own (Sonnet 5.5 high, Opus 5.5 medium)
max_arbitrations = 1          # F10: per Behavior; past it a Dispute no Invariant upholds is simply not upheld (ADR 0008)
                              # F11: [workflow.roles.arbiter] below wins over these two, field by field
# No API key here, ever: the SDK reads ANTHROPIC_API_KEY, else an `ant auth login` profile.
num_ctx = 16384
think = false                 # thinking text is dropped, so do not pay for it
num_predict = 4096            # max generated tokens per model call
max_attempts = 3
max_polish_rounds = 1         # 0 skips Polish
test_command = ".venv/bin/python -m pytest -q --no-header -p no:cacheprovider"
lint_commands = []            # each must exit 0 after Polish, or Polish is reverted
workspaces_dir = "~/.braid/workspaces"
runs_dir = "~/.braid/runs"    # one JSONL log per run
plans_dir = "~/.braid/plans"  # Plan loop output, one <id>.json per Plan
checkpoints_db = "~/.braid/workflows.db"  # TUI runs: checkpoints for /build --resume, and the /runs index
max_rounds = 3                # Plan loop: draft/review rounds
critique_angles = ["feasibility", "scope", "testability", "risk", "spacing"]
# [workflow.critique_prompts]  # a system prompt per angle: a new angle, or a replacement for a built-in one
# usability = "You review a draft Plan as the person who will use the tool ..."

# F11: Roles. Each takes model, effort and view; unset fields fall back to [workflow] (the run's model, effort, and
# arbiter/arbiter_effort for the Arbiter). With no [workflow.roles.tester] or [workflow.roles.implementer], every prompt
# is as before F11. Configuring either gives the tester its own system prompt (failure modes the goal implies).
# A Role with its own model or effort runs on the Anthropic API; its calls count toward the Spend cap and are reported
# per Role. In a batched bench every Role rides the run's own lane.
# [workflow.roles.tester]
# model = "claude-sonnet-5-5"
# effort = "medium"
# view = "interface"          # "full" (the files as they are) or "interface" (signatures, docstrings, type hints; no bodies)
# [workflow.roles.implementer]
# model = "claude-haiku-5-5"  # view is always "full": it edits the implementation
# [workflow.roles.arbiter]
# model = "claude-sonnet-5-5" # takes no view: the Arbiter never sees the implementation (F10)

# F14, F15: Skills. Agent Skills directories (a folder with SKILL.md). Only each skill's name and description go in the
# system prompt; the body loads when the model calls `skill`, or you type /skill-name. Skill text is untrusted (ADR 0011):
# `run_skill_script` runs in the Sandbox and asks for an Approval every time, whatever the skill's allowed-tools says.
[skills]
enabled = true
roots = [".braid/skills", "~/.braid/skills"]   # first match wins; "~" is yours, the rest are under the project
claude_roots = false          # true adds .claude/skills and ~/.claude/skills, read-only
max_index_tokens = 2000       # the system-prompt index; over it, skills are left out with a note
script_timeout_s = 60

# F16: MCP client. Servers are third-party code (ADR 0012): every tool call needs an Approval unless the tool's bare name
# is in `allow`; a stdio server runs in the Sandbox with an environment built from scratch (PATH, HOME, LANG, TERM and
# `env`, whose ${VAR}s must be listed in `pass_env`). Naming ANTHROPIC_API_KEY, OPENROUTER_API_KEY or any *_API_KEY is a
# config error. A server's stderr goes to ~/.braid/mcp-logs/<name>.log. Tools show as mcp__<server>__<tool>; /mcp lists
# them, /mcp restart <server> reconnects, /mcp trust <server> accepts a changed tool definition, /mcp read <server> <uri>
# attaches a resource to your next message, and /<server>:<prompt> key=value runs a server's prompt.
[mcp]
enabled = true
# [mcp.servers.git]
# command = "uvx"
# args = ["mcp-server-git", "--repository", "."]
# allow = ["git_status", "git_log", "git_diff"]   # read-only; git_commit stays gated
# paths = ["."]               # readable in the Sandbox besides the project
# [mcp.servers.fetch]
# command = "uvx"
# args = ["mcp-server-fetch"]
# network = true              # a Sandbox escape, granted here once and shown on every Approval
# timeout_s = 30
# [mcp.servers.docs]
# url = "https://docs.example.com/mcp"   # Streamable HTTP
# headers = { Authorization = "Bearer ${DOCS_TOKEN}" }
# pass_env = ["DOCS_TOKEN"]

# F18: braid as an MCP server (`braid-mcp`, stdio; ADR 0013). A client such as Claude Code may read freely and start
# bounded spends (plan, build, bench) after a human's yes through MCP elicitation. It can never give a Sign-off or apply a diff.
# Both ceilings clamp every run's Spend cap; the daily one adds up all MCP-started runs. The API keys come from the
# environment, as for the CLI, and never appear in a result.
[mcp_server]
max_cost_usd = 0.10           # per started run
daily_cost_usd = 1.00         # across all MCP-started runs
confirm = "elicit"            # "token": a two-call quote-then-start for clients without elicitation (the client's agent confirms)
backends = ["anthropic"]      # add "openrouter" to allow it
